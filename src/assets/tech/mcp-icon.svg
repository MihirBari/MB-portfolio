<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="mcpBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#915EFF"/>
    </linearGradient>
    <radialGradient id="mcpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b1535"/>
      <stop offset="100%" stop-color="#0b0819"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#mcpBg)" stroke="url(#mcpBorder)" stroke-width="3" filter="url(#glow)"/>

  <!-- Hexagonal Circuit Lines -->
  <polygon points="64,26 95,44 95,84 64,102 33,84 33,44" fill="none" stroke="#7042f8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Node Dots -->
  <circle cx="64" cy="26" r="4.5" fill="#00f0ff"/>
  <circle cx="95" cy="44" r="4.5" fill="#ec4899"/>
  <circle cx="95" cy="84" r="4.5" fill="#00f0ff"/>
  <circle cx="64" cy="102" r="4.5" fill="#915EFF"/>
  <circle cx="33" cy="84" r="4.5" fill="#ec4899"/>
  <circle cx="33" cy="44" r="4.5" fill="#00f0ff"/>

  <!-- Center Typography -->
  <text x="64" y="72" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">MCP</text>
</svg>
